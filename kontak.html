<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #E9F2FC;
            margin: 0;
            padding: 40px 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Desain Kartu Profil Utama */
        .profile-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(10, 37, 64, 0.1);
            overflow: hidden;
            position: relative;
        }

        /* Bagian Header / Latar Belakang Atas Kartu */
        .card-header {
            background: linear-gradient(135deg, #0A2540 0%, #154360 100%);
            height: 120px;
            text-align: center;
            color: white;
            padding-top: 25px;
            box-sizing: border-box;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Container untuk Foto dan Data */
        .card-body {
            padding: 0 40px 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: center 
        }

        .photo-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            z-index: 2;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .biodata-grid {
            display: grid;
            grid-template-columns: 140px 15px 1fr;
            gap: 12px 0;
            width: 100%;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #eef2f5;
        }

        .label {
            font-weight: 600;
            color: #0A2540;
            font-size: 0.95rem;
        }

        .separator {
            color: #0A2540;
            font-weight: 600;
        }

        .value {
            color: #333333;
            font-size: 0.95rem;
            font-weight: 500;
    
        }

        .value.name-highlight {
            font-weight: 600;
            color: #0A2540;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Bagian Pita Atas -->
        <div class="card-header">
            <h2>Identitas Mahasiswa</h2>
        </div>

        <!-- Bagian Isi -->
        <div class="card-body">
            
            <!-- Foto Profil Berbentuk Lingkaran -->
            <div class="photo-container">
                <img src="img/agil.jpeg" alt="Foto Mahasiswa">
            </div>

            <!-- Tabel Data Modern Menggunakan Grid -->
            <div class="biodata-grid">
                <div class="label">Nama Lengkap</div>
                <div class="separator">:</div>
                <div class="value name-highlight">Ragil Pratama Ramadhan</div>

                <div class="label">NIM</div>
                <div class="separator">:</div>
                <div class="value">10525024</div>

                <div class="label">Universitas</div>
                <div class="separator">:</div>
                <div class="value">Universitas Komputer Indonesia (UNIKOM)</div>

                <div class="label">Fakultas</div>
                <div class="separator">:</div>
                <div class="value">Teknik dan Ilmu Komputer</div>

                <div class="label">Program Studi</div>
                <div class="separator">:</div>
                <div class="value">Sistem Informasi</div>

                <div class="label">Kelas</div>
                <div class="separator">:</div>
                <div class="value">IS-1</div>

                <div class="label">Email</div>
                <div class="separator">:</div>
                <div class="value">Ragil.10525024@mahasiswa.unikom.ac.id</div>

                <div class="label">No. WhatsApp</div>
                <div class="separator">:</div>
                <div class="value">081222424943</div>
            </div>

        </div>
    </div>

</body>
</html>
